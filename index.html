<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matrix Effect</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const newColumns = Math.floor(canvas.width / fontSize);

    drops.length = 0; // limpa array

    for (let i = 0; i < newColumns; i++) {
        drops[i] = 1;
    }       
});


    const letters = "0123456789";
    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const drops = [];

    const nome = "ALEXANDRE MARQUES";
let letrasMostradas = 0;

    const programadorMessage = "PROGRAMADOR!!!";
    let programadorVisible = false;
    let programadorScale = 0.5;
    let programadorOpacity = 0;
    const programadorAnimationSpeed = 0.05;
    const programadorMaxScale = 1.2;
    const programadorFinalScale = 1;
    const programadorYOffset = 100;


    for (let i = 0; i < columns; i++) {
        drops[i] = 1;
    }

    function desenharNome() {
        ctx.fillStyle = "#00FF99"; // cor diferente para destacar
        // fonte maior

        const nomeSize = canvas.width * 0.05;
ctx.font = nomeSize + "px monospace";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
     

        const textoAtual = nome.substring(0, letrasMostradas);
        ctx.fillText(textoAtual, canvas.width / 2, canvas.height / 2);
    }

    function desenharProgramador() {
        if (programadorScale < programadorMaxScale) {
            programadorScale += programadorAnimationSpeed;
        } else if (programadorScale > programadorFinalScale) {
            programadorScale -= programadorAnimationSpeed * 0.5; // slow down retraction
        } else {
            programadorScale = programadorFinalScale; // ensure it settles
        }

        if (programadorOpacity < 1) {
            programadorOpacity += programadorAnimationSpeed * 2;
        } else {
            programadorOpacity = 1;
        }
        
        ctx.save();
        ctx.globalAlpha = programadorOpacity;
        ctx.fillStyle = "#0F0"; // Gold color for PROGRAMADOR!!!
        const programadorFontSize = (canvas.width * 0.03) * programadorScale;
        ctx.font = programadorFontSize + "px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const textX = canvas.width / 2;
        const textY = canvas.height / 2 + programadorYOffset;

        ctx.fillText(programadorMessage, textX, textY);
        ctx.restore();
    }

    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#0F0";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const text = letters[Math.floor(Math.random() * letters.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;

                if (letrasMostradas < nome.length) {
                    letrasMostradas++;
                }
            }

            drops[i]++;
        }

        // Desenha o nome uma vez por frame, após o efeito matrix
        desenharNome();

        // Lógica para a mensagem "PROGRAMADOR!!!"
        if (letrasMostradas === nome.length && !programadorVisible) {
            programadorVisible = true;
        }

        if (programadorVisible) {
            desenharProgramador();
        }
    }

    function loop() {
    draw();
    requestAnimationFrame(loop);
}

canvas.addEventListener("click", (event) => {
    if (programadorVisible) {
        const programadorFontSize = (canvas.width * 0.03) * programadorScale;
        ctx.font = programadorFontSize + "px monospace";
        const textWidth = ctx.measureText(programadorMessage).width;
        const textX = canvas.width / 2;
        const textY = canvas.height / 2 + programadorYOffset;
        
        const textLeft = textX - textWidth / 2;
        const textRight = textX + textWidth / 2;
        const textTop = textY - programadorFontSize / 2;
        const textBottom = textY + programadorFontSize / 2;

        if (event.clientX >= textLeft && event.clientX <= textRight &&
            event.clientY >= textTop && event.clientY <= textBottom) {
            window.location.href = "certificate.html";
        }
    }
});

canvas.addEventListener("mousemove", (event) => {
    if (programadorVisible) {
        const programadorFontSize = (canvas.width * 0.03) * programadorScale;
        ctx.font = programadorFontSize + "px monospace";
        const textWidth = ctx.measureText(programadorMessage).width;
        const textX = canvas.width / 2;
        const textY = canvas.height / 2 + programadorYOffset;
        
        const textLeft = textX - textWidth / 2;
        const textRight = textX + textWidth / 2;
        const textTop = textY - programadorFontSize / 2;
        const textBottom = textY + programadorFontSize / 2;

        if (event.clientX >= textLeft && event.clientX <= textRight &&
            event.clientY >= textTop && event.clientY <= textBottom) {
            canvas.style.cursor = "pointer";
        } else {
            canvas.style.cursor = "default";
        }
    }
});

loop();

</script>

</body>
</html>
