<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificados Programador</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
            gap: 30px;
            font-family: 'monospace', sans-serif;
        }
        h1 {
            color: #0F0;
            text-shadow: 0 0 10px #0F0;
            margin-bottom: 20px;
        }
        img {
            max-width: 90%;
            height: auto;
            border: 2px solid #0F0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transition: transform 0.3s;
        }
        img:hover {
            transform: scale(1.02);
        }
        #back-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #0F0;
            border: 2px solid #0F0;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
            z-index: 1000;
        }
        #back-button:hover {
            background-color: #0F0;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>CERTIFICADOS DEV</h1>
    
    <img src="Certificado - DevQuest 2.0 Front-end.png" alt="Certificado DevQuest Front-end">
    <img src="Certificado - DevQuest 2.0 Back-end (1).png" alt="Certificado DevQuest Back-end">
    <img src="Certificado - Curso IA para Devs 2.0.png" alt="Certificado Curso IA para Devs 2.0">

    <a id="back-button" href="index.html">← Voltar</a>
</body>
</html>
