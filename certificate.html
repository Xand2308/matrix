<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0; /* Espaço no topo e na base */
            gap: 20px; /* Espaço entre as imagens */
        }
        img {
            max-width: 90%;
            height: auto;
            border: 2px solid #0F0;
        }
        /* Estilo do botão de voltar */
        #back-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: transparent;
            color: #0F0;
            border: 2px solid #0F0;
            text-decoration: none;
            font-family: 'monospace', sans-serif;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
            z-index: 1000;
        }
        #back-button:hover {
            background-color: #0F0;
            color: #000;
        }
    </style>
    </head>
    <body>
    <img src="Certificado - DevQuest 2.0 Front-end.png" alt="Certificado DevQuest Front-end">
    <img src="Certificado - DevQuest 2.0 Back-end (1).png" alt="Certificado DevQuest Back-end">

    <a id="back-button" href="index.html">← Voltar</a>
    </body>
</html>
